    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- FIREBASE SETUP ---
        const firebaseConfig = {
            apiKey: "AIzaSyC-zGSwTLq84DV3H-g_XL5-GnwSnaiPF6M",
            authDomain: "navrose-earning-app-version-3.firebaseapp.com",
            databaseURL: "https://navrose-earning-app-version-3-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "navrose-earning-app-version-3",
            storageBucket: "navrose-earning-app-version-3.firebasestorage.app",
            messagingSenderId: "1055847392099",
            appId: "1:1055847392099:web:743985132a92f4e9d62956"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        
        // --- HELPERS ---
        const compressImageToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onerror = reject;
            reader.onload = (event) => {
                if (event.target && typeof event.target.result === 'string') {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onerror = reject;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const maxWidth = 800;
                        const scaleSize = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        if (ctx) {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            resolve(canvas.toDataURL('image/jpeg', 0.7));
                        } else {
                            reject(new Error('Could not get canvas context.'));
                        }
                    };
                } else {
                    reject(new Error('FileReader result is not a string.'));
                }
            };
        });

        const Notification = ({ message, type, show, onHide }) => {
            useEffect(() => {
                if (show) {
                    const timer = setTimeout(() => onHide(), 5000);
                    return () => clearTimeout(timer);
                }
            }, [show, onHide]);
            return <div className={`notification ${type} ${show ? 'show' : ''}`}>{message}</div>;
        };

        const ConfirmModal = ({ show, message, onConfirm, onCancel }) => {
            if (!show) return null;
            return (
                <div className="modal-overlay">
                    <div className="modal-content">
                        <p>{message}</p>
                        <div className="modal-actions">
                            <button onClick={onCancel} className="btn-cancel">Cancel</button>
                            <button onClick={() => { onConfirm(); onCancel(); }} className="btn-confirm">Confirm</button>
                        </div>
                    </div>
                </div>
            );
        };
        
        const ImageModal = ({ src, onClose }) => {
            if (!src) return null;
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content image-modal-content" onClick={e => e.stopPropagation()}>
                        <button className="modal-close-btn" onClick={onClose}>&times;</button>
                        <img src={src} alt="Payment Proof" />
                    </div>
                </div>
            );
        };
        
        const UserEditModal = ({ user, onSave, onCancel }) => {
            const [formData, setFormData] = useState({ name: '', role: 'user', upiId: '', brokeragePlan: 'normal' });
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if (user) {
                    setFormData({
                        name: user.name || '',
                        role: user.role || 'user',
                        upiId: user.upiId || '',
                        brokeragePlan: user.brokeragePlan || 'normal',
                    });
                }
            }, [user]);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                await onSave('users', user.id, formData, 'User updated successfully!', 'Failed to update user.');
                setLoading(false);
                onCancel();
            };

            if (!user) return null;

            return (
                <div className="modal-overlay">
                    <div className="modal-content">
                        <button className="modal-close-btn" onClick={onCancel}>&times;</button>
                        <h3>Edit User: {user.mobile}</h3>
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label>Name</label>
                                <input type="text" name="name" value={formData.name} onChange={handleChange} required />
                            </div>
                            <div className="form-group">
                                <label>Role</label>
                                <select name="role" value={formData.role} onChange={handleChange}>
                                    <option value="user">User</option>
                                    <option value="seller">Seller</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div>
                             <div className="form-group">
                                <label>Brokerage Plan</label>
                                <select name="brokeragePlan" value={formData.brokeragePlan} onChange={handleChange}>
                                    <option value="normal">Normal (Free)</option>
                                    <option value="buyer">Buyer Plan</option>
                                    <option value="seller">Seller Plan</option>
                                </select>
                            </div>
                            {formData.role === 'seller' && (
                                <div className="form-group">
                                    <label>UPI ID</label>
                                    <input type="text" name="upiId" value={formData.upiId} onChange={handleChange} placeholder="e.g., seller@okbank" />
                                </div>
                            )}
                            <div className="modal-actions">
                                <button type="button" className="btn-cancel" onClick={onCancel}>Cancel</button>
                                <button type="submit" className="btn-confirm" disabled={loading}>{loading ? 'Saving...' : 'Save Changes'}</button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const SortableTableView = ({ columns, data, initialSort, footerData, onDelete, onEdit }) => {
            const [filterText, setFilterText] = useState('');
            const [sortConfig, setSortConfig] = useState(initialSort || { key: columns[0].key, direction: 'descending' });

            const sortedAndFilteredData = useMemo(() => {
                let filteredData = data;
                if (filterText) {
                    filteredData = data.filter(item => {
                        return Object.values(item).some(val => 
                            String(val).toLowerCase().includes(filterText.toLowerCase())
                        );
                    });
                }

                const sortedData = [...filteredData].sort((a, b) => {
                    const valA = a[sortConfig.key];
                    const valB = b[sortConfig.key];
                    if (valA < valB) {
                        return sortConfig.direction === 'ascending' ? -1 : 1;
                    }
                    if (valA > valB) {
                        return sortConfig.direction === 'ascending' ? 1 : -1;
                    }
                    return 0;
                });

                return sortedData;
            }, [data, filterText, sortConfig]);

            const requestSort = (key) => {
                let direction = 'ascending';
                if (sortConfig.key === key && sortConfig.direction === 'ascending') {
                    direction = 'descending';
                }
                setSortConfig({ key, direction });
            };

            const totals = useMemo(() => {
                if (!footerData) return null;
                return footerData(sortedAndFilteredData);
            }, [sortedAndFilteredData, footerData]);

            return (
                <div>
                    <div className="table-controls">
                        <input
                            type="text"
                            placeholder="Filter table data..."
                            value={filterText}
                            onChange={(e) => setFilterText(e.target.value)}
                        />
                    </div>
                    <div className="table-container">
                        <table className="data-table">
                            <thead>
                                <tr>
                                    {columns.map(col => (
                                        <th key={col.key} onClick={() => col.sortable !== false && requestSort(col.key)}>
                                            {col.header}
                                            {sortConfig.key === col.key && (sortConfig.direction === 'ascending' ? ' ▲' : ' ▼')}
                                        </th>
                                    ))}
                                    {(onDelete || onEdit) && <th>Actions</th>}
                                </tr>
                            </thead>
                            <tbody>
                                {sortedAndFilteredData.map(item => (
                                    <tr key={item.id}>
                                        {columns.map(col => (
                                            <td key={col.key} style={{ textAlign: col.isNumeric ? 'right' : 'left' }}>
                                                {col.render ? col.render(item) : (col.formatter ? col.formatter(item[col.key]) : item[col.key])}
                                            </td>
                                        ))}
                                        {(onDelete || onEdit) && (
                                            <td>
                                                <div className="ad-actions">
                                                    {onEdit && <button className="btn-edit" onClick={() => onEdit(item)}>Edit</button>}
                                                    {onDelete && <button className="btn-delete" onClick={() => onDelete(item.id)}>Delete</button>}
                                                </div>
                                            </td>
                                        )}
                                    </tr>
                                ))}
                            </tbody>
                            {totals && (
                                <tfoot>
                                    <tr>
                                        {columns.map(col => (
                                            <td key={col.key}>{totals[col.key] || ''}</td>
                                        ))}
                                        {(onDelete || onEdit) && <td></td>}
                                    </tr>
                                </tfoot>
                            )}
                        </table>
                    </div>
                </div>
            );
        };

        const ReportsView = ({ data }) => {
            const { users, ads, p2pOrders } = data;

            const kpis = useMemo(() => {
                const deliveredOrders = p2pOrders.filter(o => o.status === 'delivered');
                const totalSalesVolume = deliveredOrders.reduce((sum, o) => sum + (o.totalAmount || 0), 0);
                
                return {
                    totalUsers: users.length,
                    totalSellers: users.filter(u => u.role === 'seller').length,
                    approvedAds: ads.filter(a => a.status === 'approved').length,
                    deliveredOrders: deliveredOrders.length,
                    totalSalesVolume: `₹${totalSalesVolume.toFixed(2)}`,
                };
            }, [users, ads, p2pOrders]);

            const transactionSummary = useMemo(() => {
                const summary = {};
                p2pOrders.forEach(order => {
                    const status = order.status || 'unknown';
                    if (!summary[status]) {
                        summary[status] = { count: 0, value: 0 };
                    }
                    summary[status].count++;
                    summary[status].value += (order.totalAmount || 0);
                });
                return Object.entries(summary).map(([status, data]) => ({
                    status: status.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()),
                    count: data.count,
                    value: `₹${data.value.toFixed(2)}`
                })).sort((a,b) => a.status.localeCompare(b.status));
            }, [p2pOrders]);

            return (
                <div className="reports-page">
                    <h2>Business Reports</h2>
                    <div className="kpi-grid">
                        <div className="kpi-card"><h4>Total Users</h4><p>{kpis.totalUsers}</p></div>
                        <div className="kpi-card"><h4>Total Sellers</h4><p>{kpis.totalSellers}</p></div>
                        <div className="kpi-card"><h4>Approved Ads</h4><p>{kpis.approvedAds}</p></div>
                        <div className="kpi-card"><h4>Completed Orders</h4><p>{kpis.deliveredOrders}</p></div>
                        <div className="kpi-card"><h4>Total Sales Volume</h4><p>{kpis.totalSalesVolume}</p></div>
                    </div>

                    <h3>Balance Sheet (Transaction Summary)</h3>
                    <div className="table-container" style={{maxHeight: 'none'}}>
                        <table className="data-table">
                            <thead>
                                <tr>
                                    <th>Status</th>
                                    <th>Number of Orders</th>
                                    <th>Total Value</th>
                                </tr>
                            </thead>
                            <tbody>
                                {transactionSummary.map(row => (
                                    <tr key={row.status}>
                                        <td>{row.status}</td>
                                        <td>{row.count}</td>
                                        <td>{row.value}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };
        
        // --- MAIN ADMIN APP ---
        const AdminApp = () => {
            const [adminView, setAdminView] = useState('dashboard');
            const [ads, setAds] = useState([]);
            const [users, setUsers] = useState([]);
            const [p2pOrders, setP2POrders] = useState([]);
            const [boosterOffers, setBoosterOffers] = useState([]);
            
            const [loading, setLoading] = useState(true);
            const [notification, setNotification] = useState({ show: false, message: '', type: '' });
            const [confirmModal, setConfirmModal] = useState({ show: false, message: '', onConfirm: () => {} });
            const [paymentProofUrl, setPaymentProofUrl] = useState(null);
            
            const showNotification = (message, type = 'info') => setNotification({ show: true, message, type });
            const hideNotification = () => setNotification(prev => ({ ...prev, show: false }));
            const showConfirm = (message, onConfirm) => setConfirmModal({ show: true, message, onConfirm });
            const hideConfirm = () => setConfirmModal({ show: false, message: '', onConfirm: () => {} });

            useEffect(() => {
                const collections = {
                    'ads': setAds, 'users': setUsers, 'boosterOffers': setBoosterOffers, 'p2p_orders': setP2POrders
                };

                const unsubscribers = Object.entries(collections).map(([name, setter]) => {
                    const query = db.collection(name);
                    return query.onSnapshot(
                        snap => {
                            const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            // Sort data client-side if it has a createdAt field
                            if (data.length > 0 && data[0].createdAt) {
                                data.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                            }
                            setter(data);
                        },
                        err => console.error(`Error fetching ${name}:`, err)
                    );
                });
                
                setTimeout(() => setLoading(false), 2000);

                return () => unsubscribers.forEach(unsub => unsub());
            }, []);
            
            const pendingAds = useMemo(() => ads.filter(ad => ad.status === 'pending'), [ads]);
            const pendingP2POrders = useMemo(() => p2pOrders.filter(o => o.status === 'pending_payment'), [p2pOrders]);
            const totalPendingCount = pendingAds.length + pendingP2POrders.length;


            // --- CUD (Create, Update, Delete) Handlers ---
            const createOrUpdateDoc = async (collection, docId, data, successMsg, errorMsg) => {
                try {
                    if (docId) {
                        await db.collection(collection).doc(docId).set(data, { merge: true });
                    } else {
                        await db.collection(collection).add(data);
                    }
                    showNotification(successMsg, 'success');
                } catch (error) {
                    console.error(errorMsg, error);
                    showNotification(errorMsg, 'error');
                }
            };
            
            const deleteDoc = (collection, docId, successMsg, errorMsg) => {
                showConfirm(`Are you sure you want to permanently delete this item?`, async () => {
                    try {
                        await db.collection(collection).doc(docId).delete();
                        showNotification(successMsg, 'success');
                    } catch (error) { showNotification(errorMsg, 'error'); }
                });
            };

            const handleUpdateStatus = async (collection, docId, newStatus, relatedDoc = {}) => {
                try {
                    await db.collection(collection).doc(docId).update({ status: newStatus });
                    showNotification(`Status updated to ${newStatus}.`, 'success');

                    const buyerId = relatedDoc.buyerId;
                    if (buyerId && collection === 'p2p_orders') {
                        const orderId = docId.substring(0, 8).toUpperCase();
                        const statusMessages = {
                            payment_verified: `Seller confirmed payment for order #${orderId}.`,
                            shipped: `Your order #${orderId} has been shipped.`,
                            delivered: `Your order #${orderId} has been delivered!`,
                            cancelled: `Unfortunately, your order #${orderId} has been cancelled by the seller.`
                        };
                        
                        if (statusMessages[newStatus]) {
                            await db.collection('notifications').add({
                                userId: buyerId,
                                message: statusMessages[newStatus],
                                link: 'myOrders',
                                read: false,
                                createdAt: firebase.firestore.FieldValue.serverTimestamp()
                            });
                        }
                    }
                } catch (error) {
                    console.error(`Failed to update status or send notification for ${collection}/${docId}:`, error);
                    showNotification('Operation failed. Please check console for details.', 'error');
                }
            };

            if (loading) return <div className="loading-container"><div className="spinner"></div></div>;

            return (
                <div className="app-container">
                    <Notification show={notification.show} message={notification.message} type={notification.type} onHide={hideNotification} />
                    <ConfirmModal show={confirmModal.show} message={confirmModal.message} onConfirm={confirmModal.onConfirm} onCancel={hideConfirm} />
                    <ImageModal src={paymentProofUrl} onClose={() => setPaymentProofUrl(null)} />
                    
                    <header className="header">
                        <h1>Navrose Admin</h1>
                    </header>

                    <main className="main-content">
                        <AdminPanel 
                            adminView={adminView}
                            setAdminView={setAdminView}
                            data={{ ads, users, p2pOrders, boosterOffers }}
                            handlers={{ handleUpdateStatus, deleteDoc, createOrUpdateDoc, onShowProof: setPaymentProofUrl, showNotification }}
                            pendingCounts={{ ads: pendingAds.length, p2pOrders: pendingP2POrders.length }}
                        />
                    </main>
                </div>
            );
        };
        
        const BoosterOffersView = ({ offers, handlers }) => {
            const initialFormState = { title: '', description: '', imageBase64: null };
            const [formData, setFormData] = useState(initialFormState);
            const [editingOffer, setEditingOffer] = useState(null);
            const [loading, setLoading] = useState(false);
            const { createOrUpdateDoc, deleteDoc, showNotification } = handlers;

            useEffect(() => {
                if (editingOffer) {
                    setFormData({
                        title: editingOffer.title || '',
                        description: editingOffer.description || '',
                        imageBase64: editingOffer.imageBase64 || null,
                    });
                } else {
                    setFormData(initialFormState);
                }
            }, [editingOffer]);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleFileChange = async (e) => {
                if (e.target.files && e.target.files[0]) {
                     try {
                        const base64 = await compressImageToBase64(e.target.files[0]);
                        setFormData(prev => ({ ...prev, imageBase64: base64 }));
                    } catch (error) {
                        showNotification('Error processing image.', 'error');
                    }
                }
            };
            
            const resetForm = () => {
                setEditingOffer(null);
                const fileInput = document.getElementById('booster-image-input');
                if(fileInput) fileInput.value = '';
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!formData.title || !formData.description || !formData.imageBase64) {
                    showNotification('Please fill all fields and upload an image.', 'error');
                    return;
                }
                setLoading(true);
                const data = {
                    ...formData,
                    createdAt: editingOffer?.createdAt || firebase.firestore.FieldValue.serverTimestamp()
                };
                const successMsg = editingOffer ? 'Offer updated!' : 'Offer created!';
                await createOrUpdateDoc('boosterOffers', editingOffer?.id, data, successMsg, 'Failed to save offer.');
                setLoading(false);
                resetForm();
            };

            return (
                <div>
                    <h3>Booster Offers (Flash Offers)</h3>
                    <form className="form-container" onSubmit={handleSubmit}>
                        <h4>{editingOffer ? 'Edit Offer' : 'Create New Offer'}</h4>
                        <div className="form-group">
                            <label>Title</label>
                            <input type="text" name="title" value={formData.title} onChange={handleInputChange} required />
                        </div>
                        <div className="form-group">
                            <label>Description</label>
                            <textarea name="description" value={formData.description} onChange={handleInputChange} required />
                        </div>
                        <div className="form-group">
                            <label>Offer Image</label>
                            <input id="booster-image-input" type="file" accept="image/*" onChange={handleFileChange} />
                            {formData.imageBase64 && <img src={formData.imageBase64} alt="Offer Preview" className="image-preview" />}
                        </div>
                        <button className="btn-approve" type="submit" disabled={loading}>
                            {loading ? 'Saving...' : (editingOffer ? 'Save Changes' : 'Create Offer')}
                        </button>
                        {editingOffer && <button type="button" className="btn-cancel" style={{marginLeft: '1rem'}} onClick={resetForm}>Cancel Edit</button>}
                    </form>
                    
                    <h4>Existing Offers</h4>
                    {Array.isArray(offers) && offers.length > 0 ? (
                        <ul className="ads-list">
                            {offers.map(offer => (
                                <li key={offer.id} className="ads-list-item">
                                    <img src={offer.imageBase64 || 'https://via.placeholder.com/80'} alt={offer.title} />
                                    <div className="ad-info">
                                        <h4>{offer.title}</h4>
                                        <p>{offer.description}</p>
                                    </div>
                                    <div className="ad-actions">
                                        <button className="btn-edit" onClick={() => setEditingOffer(offer)}>Edit</button>
                                        <button className="btn-delete" onClick={() => deleteDoc('boosterOffers', offer.id, 'Offer deleted.', 'Failed to delete offer.')}>Delete</button>
                                    </div>
                                </li>
                            ))}
                        </ul>
                    ) : (
                        <p>No booster offers have been created yet.</p>
                    )}
                </div>
            );
        };
        
        const AdsManagementView = ({ ads, handlers }) => {
            const [statusFilter, setStatusFilter] = useState('pending');
            const { handleUpdateStatus, deleteDoc } = handlers;
            const filteredAds = useMemo(() => ads.filter(ad => ad.status === statusFilter), [ads, statusFilter]);

            return (
                <div>
                    <h3>Ad Management</h3>
                    <div className="tab-controls">
                        <button className={`tab-button ${statusFilter === 'pending' ? 'active' : ''}`} onClick={() => setStatusFilter('pending')}>Pending</button>
                        <button className={`tab-button ${statusFilter === 'approved' ? 'active' : ''}`} onClick={() => setStatusFilter('approved')}>Approved</button>
                        <button className={`tab-button ${statusFilter === 'rejected' ? 'active' : ''}`} onClick={() => setStatusFilter('rejected')}>Rejected</button>
                    </div>
                    {filteredAds.length === 0 ? <p>No ads found with status '{statusFilter}'.</p> : (
                        <ul className="ads-list">
                            {filteredAds.map(ad => (
                                <li key={ad.id} className="ads-list-item">
                                    <img src={ad.imageBase64 || 'https://via.placeholder.com/80'} alt={ad.title} />
                                    <div className="ad-info"><h4>{ad.title}</h4><p>User: {ad.user} | Price: ₹{ad.price}</p></div>
                                    <div className="ad-actions">
                                        {statusFilter === 'pending' && (
                                            <>
                                                <button className="btn-approve" onClick={() => handleUpdateStatus('ads', ad.id, 'approved', ad)}>Approve</button>
                                                <button className="btn-reject" onClick={() => handleUpdateStatus('ads', ad.id, 'rejected', ad)}>Reject</button>
                                            </>
                                        )}
                                        <button className="btn-delete" onClick={() => deleteDoc('ads', ad.id, 'Ad deleted.', 'Failed to delete ad.')}>Delete</button>
                                    </div>
                                </li>
                            ))}
                        </ul>
                    )}
                </div>
            );
        };

        const BrokerageSettingsView = ({ handlers }) => {
            const { showNotification } = handlers;
            const [settings, setSettings] = useState({ buyer: 0, seller: 0, normal: 0 });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetchSettings = async () => {
                    setLoading(true);
                    try {
                        const docRef = db.collection('app_settings').doc('brokerage');
                        const doc = await docRef.get();
                        if (doc.exists) {
                            setSettings(doc.data());
                        } else {
                            // If settings don't exist, create them
                            await docRef.set({ buyer: 1, seller: 3, normal: 0 });
                            setSettings({ buyer: 1, seller: 3, normal: 0 });
                        }
                    } catch (error) {
                        showNotification('Failed to load brokerage settings.', 'error');
                    } finally {
                        setLoading(false);
                    }
                };
                fetchSettings();
            }, []);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setSettings(prev => ({ ...prev, [name]: parseFloat(value) || 0 }));
            };

            const handleSave = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    await db.collection('app_settings').doc('brokerage').set(settings);
                    showNotification('Brokerage settings saved successfully!', 'success');
                } catch (error) {
                    showNotification('Failed to save settings.', 'error');
                } finally {
                    setLoading(false);
                }
            };

            if (loading && !Object.keys(settings).length) return <div className="spinner"></div>;

            return (
                <div>
                    <h3>Brokerage Fee Settings</h3>
                    <form className="form-container" onSubmit={handleSave}>
                        <p>Set the percentage of the transaction total to charge as a platform fee.</p>
                        <div className="form-group">
                            <label>Buyer Fee (%) - for users on the 'Buyer' plan</label>
                            <input type="number" name="buyer" value={settings.buyer} onChange={handleChange} min="0" step="0.1" />
                        </div>
                        <div className="form-group">
                            <label>Seller Fee (%) - for users on the 'Seller' plan</label>
                            <input type="number" name="seller" value={settings.seller} onChange={handleChange} min="0" step="0.1" />
                        </div>
                         <div className="form-group">
                            <label>Normal User Fee (%) - for users on the 'Normal' plan</label>
                            <input type="number" name="normal" value={settings.normal} onChange={handleChange} min="0" step="0.1" />
                        </div>
                        <button type="submit" className="btn-approve" disabled={loading}>
                            {loading ? 'Saving...' : 'Save Settings'}
                        </button>
                    </form>
                </div>
            );
        };
        
        const AdminPanel = ({ adminView, setAdminView, data, handlers, pendingCounts }) => {
            const { ads, users, p2pOrders, boosterOffers } = data;
            const { handleUpdateStatus, deleteDoc, createOrUpdateDoc, onShowProof } = handlers;
            const [editingUser, setEditingUser] = useState(null);

            const adminServices = [
                { name: 'P2P Orders', view: 'p2pOrders', count: pendingCounts.p2pOrders, icon: <svg viewBox="0 0 24 24"><path d="M12 2L1 9l4 12h14l4-12L12 2zm0 4.34L17.66 9h-11.32L12 6.34zM6 19v-8h12v8H6z"></path></svg>},
                { name: 'P2P Ledger', view: 'p2pLedger', count: 0, icon: <svg viewBox="0 0 24 24"><path d="M19.5 3.5L18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2 4.5 3.5 3 2v14.5c0 1.38 1.12 2.5 2.5 2.5h13c1.38 0 2.5-1.12 2.5-2.5V2l-1.5 1.5zM19 18H7V5h12v13z M9 7h8v2H9z m0 4h8v2H9z m0 4h5v2H9z"></path></svg> },
                { name: 'Ad Management', view: 'adManagement', count: pendingCounts.ads, icon: <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"></path></svg> },
                { name: 'User Management', view: 'users', count: 0, icon: <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"></path></svg> },
                { name: 'Booster Offers', view: 'boosterOffers', count: 0, icon: <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"></path></svg> },
                { name: 'Brokerage Settings', view: 'brokerageSettings', count: 0, icon: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"></path></svg> },
                { name: 'Reports', view: 'reports', count: 0, icon: <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"></path></svg> },
            ];
            
            const renderContent = () => {
                 switch (adminView) {
                    case 'adManagement': return <AdsManagementView ads={ads} handlers={handlers} />;
                    case 'p2pOrders': {
                        const orders = p2pOrders;
                        const title = 'Peer-to-Peer (P2P) Orders';
                        const statusOptions = ['pending_payment', 'payment_verified', 'shipped', 'delivered', 'cancelled'];
                        
                        return (
                        <div>
                            <h3>{title}</h3>
                            <ul className="ads-list">
                                {orders.map(order => (
                                    <li key={order.id} className="ads-list-item">
                                        <div className="order-details">
                                            <h4>Order ID: {order.id.substring(0,8).toUpperCase()}</h4>
                                            <p>Buyer: {order.buyerId}</p>
                                            <p>Seller: {order.sellerId}</p>
                                            <p><strong>Total: ₹{(order.totalAmount || 0).toFixed(2)}</strong></p>
                                            <p><small>Placed: {order.createdAt ? order.createdAt.toDate().toLocaleString() : 'N/A'}</small></p>
                                            {order.paymentProofImage && (
                                                 <button className="btn-edit" style={{marginTop: '0.5rem'}} onClick={() => onShowProof(order.paymentProofImage)}>
                                                    View Payment Proof
                                                 </button>
                                            )}
                                        </div>
                                        <div className="order-actions">
                                            <span className={`ad-status status-${order.status}`}>{order.status.replace('_',' ')}</span>
                                            <select className="order-status-select" value={order.status} onChange={e => handleUpdateStatus('p2p_orders', order.id, e.target.value, order)}>
                                                {statusOptions.map(s => <option key={s} value={s}>{s.replace('_',' ')}</option>)}
                                            </select>
                                            <button className="btn-delete" onClick={() => deleteDoc('p2p_orders', order.id, 'Order deleted.', 'Failed to delete order.')}>Delete</button>
                                        </div>
                                    </li>
                                ))}
                            </ul>
                        </div>);
                    }
                    case 'p2pLedger': {
                        const columns = [
                            { key: 'createdAt', header: 'Date', formatter: (ts) => ts ? ts.toDate().toLocaleDateString() : 'N/A' },
                            { key: 'buyerId', header: 'Buyer' },
                            { key: 'sellerId', header: 'Seller' },
                            { key: 'totalAmount', header: 'Amount (₹)', isNumeric: true, formatter: (val) => (val || 0).toFixed(2) },
                            { key: 'status', header: 'Status', render: (item) => <span className={`ad-status status-${item.status}`}>{item.status.replace('_', ' ')}</span> },
                        ];
                        const footerData = (filteredData) => ({
                            sellerId: 'Grand Total (Delivered):',
                            totalAmount: `₹${filteredData.filter(item => item.status === 'delivered').reduce((sum, item) => sum + (item.totalAmount || 0), 0).toFixed(2)}`
                        });
                        return (
                            <div>
                                <h3>P2P Transaction Ledger</h3>
                                <SortableTableView 
                                    columns={columns} 
                                    data={p2pOrders}
                                    initialSort={{ key: 'createdAt', direction: 'descending' }}
                                    footerData={footerData}
                                    onDelete={(id) => deleteDoc('p2p_orders', id, 'Order deleted.', 'Failed to delete order.')}
                                />
                            </div>
                        );
                    }
                    case 'users': {
                         const columns = [
                            { key: 'name', header: 'Name' },
                            { key: 'mobile', header: 'Mobile' },
                            { key: 'role', header: 'Role' },
                             { key: 'brokeragePlan', header: 'Brokerage Plan' },
                            { key: 'upiId', header: 'UPI ID' },
                        ];
                        return (
                            <div>
                                <h3>User Management</h3>
                                <SortableTableView
                                    columns={columns}
                                    data={users}
                                    initialSort={{ key: 'name', direction: 'ascending' }}
                                    onEdit={(user) => setEditingUser(user)}
                                    onDelete={(id) => deleteDoc('users', id, 'User deleted.', 'Failed to delete user.')}
                                />
                            </div>
                        );
                    }
                    case 'boosterOffers': return <BoosterOffersView offers={boosterOffers} handlers={handlers} />;
                    case 'brokerageSettings': return <BrokerageSettingsView handlers={handlers} />;
                    case 'reports': return <ReportsView data={data} />;
                    default: return (
                        <div className="dashboard-page">
                            <h2>Admin Dashboard</h2>
                            <div className="dashboard-grid">
                                {adminServices.map(service => (
                                    <div key={service.name} className="dashboard-icon-card" onClick={() => setAdminView(service.view)}>
                                        {service.count > 0 && <span className="item-count-badge">{service.count}</span>}
                                        <div className="icon-wrapper">{service.icon}</div>
                                        <p>{service.name}</p>
                                    </div>
                                ))}
                            </div>
                        </div>);
                 }
            };
            
            return (
                <div>
                    {editingUser && <UserEditModal user={editingUser} onSave={createOrUpdateDoc} onCancel={() => setEditingUser(null)} />}
                    {adminView !== 'dashboard' && (
                        <>
                            <button onClick={() => setAdminView('dashboard')} style={{ marginBottom: '1rem' }}>&larr; Back to Dashboard</button>
                        </>
                    )}
                    {renderContent()}
                </div>
            );
        };
        
        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(<AdminApp />);
        }
    </script>

<script></script>
<script src="./script.js"></script></body></html>
